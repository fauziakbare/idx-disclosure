name: IDX Disclosure 24/7 Watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Pipeline
        env:
          TZ: 'Asia/Jakarta'
          FETCH_LIMIT: 30
          TRIAGE_BASE_URL: ${{ secrets.TRIAGE_BASE_URL || vars.TRIAGE_BASE_URL }}
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
          TRIAGE_MODEL_NAME: ${{ secrets.TRIAGE_MODEL_NAME || vars.TRIAGE_MODEL_NAME }}
          TRIAGE_VISION_MODEL_NAME: ${{ secrets.TRIAGE_VISION_MODEL_NAME || vars.TRIAGE_VISION_MODEL_NAME }}
          REASONER_BASE_URL: ${{ secrets.REASONER_BASE_URL || vars.REASONER_BASE_URL }}
          REASONER_API_KEY: ${{ secrets.REASONER_API_KEY }}
          REASONER_MODEL_NAME: ${{ secrets.REASONER_MODEL_NAME || vars.REASONER_MODEL_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PROXY_LIST_URL: ${{ secrets.PROXY_LIST_URL }}
        run: python -m src.main
