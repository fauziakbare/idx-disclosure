[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-disclosure-intelligence"
version = "0.1.0"
description = "IDX Disclosure Intelligence Pipeline"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7.0",
    "playwright>=1.45.0",
    "pymupdf>=1.24.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]